# SGC KS watermark settings. Glass style: the video shows through the letters, lightened.
# Codes: "Code BAH" = style D (very faint), "Code BAHH" = style C (faint).
TEXT="SGC KS"
POSITION="bottom-center"  # bottom-right | bottom-left | bottom-center | top-right | top-left | center
SIZE="0.03"               # text height as a fraction of video height (min 18px)
FONT="$DIR/Inter-Black.otf"   # bold, bundled with the skill
DEFAULT_CODE="BAHH"

# How much the letters lighten the footage behind them (0-1)
LIFT_BAH="0.20"           # style D - very faint
LIFT_BAHH="0.30"          # style C - faint
