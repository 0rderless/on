# Watermark settings — once confirmed, every clip uses these exact values.
TEXT="@maverick"          # watermark text (ignored if LOGO is set)
LOGO=""                   # optional path to a PNG logo, e.g. watermark/logo.png
POSITION="bottom-right"   # bottom-right | bottom-left | bottom-center | top-right | top-left | center
OPACITY="0.6"             # 0.0 - 1.0
SIZE="0.045"              # text height (or logo width x0.4) as a fraction of video height
FONT="/usr/share/fonts/opentype/inter/Inter-Bold.otf"
