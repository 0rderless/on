<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SurfHaven</title>
<meta name="description" content="SurfHaven - endless rail runner">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SurfHaven">
<meta name="theme-color" content="#1b4fd8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1b4fd8; --blue2:#2f7bff; --yellow:#ffc21a; --orange:#ff8a00; --red:#e8323c;
  --green:#2fbf4a; --ink:#0d1330; --white:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b4fd8;position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
body{font-family:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;color:#fff;letter-spacing:.5px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.stroke{text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;touch-action:manipulation}
.btn{display:block;width:100%;padding:14px 18px;font-size:22px;border-radius:16px;background:var(--green);
  box-shadow:0 6px 0 #1a7d2e,0 8px 16px rgba(0,0,0,.3);border:3px solid var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1a7d2e}
.btn.blue{background:var(--blue2);box-shadow:0 6px 0 #1640a8,0 8px 16px rgba(0,0,0,.3)}
.btn.yellow{background:var(--yellow);color:var(--ink);text-shadow:none;box-shadow:0 6px 0 #c48a00,0 8px 16px rgba(0,0,0,.3)}
.btn.red{background:var(--red);box-shadow:0 6px 0 #a3141c,0 8px 16px rgba(0,0,0,.3)}
.btn.small{font-size:16px;padding:9px 10px;border-radius:12px;box-shadow:0 4px 0 #1a7d2e}
.btn:disabled{filter:grayscale(.8) brightness(.8)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:10;
  padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 18px)}
.screen.show{display:flex}
.dim{background:rgba(8,14,48,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);justify-content:center}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.show{display:block}
#pauseBtn{pointer-events:auto;position:absolute;left:14px;top:calc(var(--safe-t) + 12px);width:50px;height:50px;border-radius:14px;
  background:rgba(13,19,48,.55);border:3px solid rgba(255,255,255,.85);font-size:20px;display:flex;align-items:center;justify-content:center;gap:5px}
#pauseBtn i{display:block;width:6px;height:20px;background:#fff;border-radius:2px}
#scoreBox{position:absolute;right:14px;top:calc(var(--safe-t) + 10px);text-align:right}
#score{font-size:38px;line-height:1}
.row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;font-size:24px}
.coinIcon{display:inline-block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc21a 45%,#e08a00);border:2px solid #8a5200;box-shadow:inset 0 0 0 2px #ffd64a}
.keyIcon{font-size:20px}
#multBadge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;background:var(--orange);border:2px solid var(--ink);font-size:20px}
#multBadge.hot{background:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#powerups{position:absolute;left:14px;top:calc(var(--safe-t) + 74px);display:flex;flex-direction:column;gap:8px}
.pu{display:none;align-items:center;gap:8px;background:rgba(13,19,48,.55);border:2px solid rgba(255,255,255,.7);border-radius:14px;padding:5px 8px}
.pu.show{display:flex}
.pu .ic{font-size:22px;width:28px;text-align:center}
.pu .bar{width:70px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.pu .bar b{display:block;height:100%;background:var(--yellow);border-radius:6px}
#invBadge{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 16px);padding:4px 12px;border-radius:12px;
  background:linear-gradient(90deg,#8a2be2,#2f7bff);border:2px solid #fff;font-size:15px;display:none}
#toast{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:40px;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}

/* ---------- Menu ---------- */
#menu{justify-content:space-between}
.logo{width:min(64vw,300px);border-radius:22%;box-shadow:0 10px 0 rgba(13,19,48,.5),0 0 0 4px #fff;margin-top:4px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(13,19,48,.6);border:2px solid rgba(255,255,255,.75);border-radius:999px;padding:5px 12px;font-size:17px;display:flex;align-items:center;gap:6px}
.menuBottom{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#charLabel{font-size:26px;text-align:center}
#playBtn{font-size:30px;padding:16px;animation:pulse2 1.1s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.04)}}
.btnRow{display:flex;gap:10px}
.hint{font-size:14px;text-align:center;opacity:.9;font-family:system-ui,sans-serif;font-weight:700}

/* ---------- Shop ---------- */
#shop{justify-content:flex-end;padding:0}
.sheet{width:100%;max-width:520px;height:60%;background:linear-gradient(#2f7bff,#1b4fd8);border-top:4px solid var(--ink);
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:14px 14px calc(var(--safe-b) + 12px);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.shopHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shopHead h2{margin:0;font-size:30px;font-weight:400}
.freeTag{background:var(--yellow);color:var(--ink);border-radius:10px;padding:3px 9px;font-size:15px;border:2px solid var(--ink);transform:rotate(-4deg);display:inline-block}
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:rgba(13,19,48,.35);font-size:16px;border:2px solid transparent}
.tab.on{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.shopBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:rgba(255,255,255,.14);border:3px solid rgba(13,19,48,.6);border-radius:16px;padding:10px;text-align:center;position:relative}
.card.sel{border-color:var(--yellow);background:rgba(255,194,26,.22)}
.card .av{width:62px;height:62px;margin:2px auto 6px;border-radius:50%;border:3px solid var(--ink);position:relative;overflow:hidden}
.card .nm{font-size:18px;margin-bottom:8px}
.card .ribbon{position:absolute;top:6px;right:-4px;background:var(--red);font-size:12px;padding:2px 8px;border-radius:6px 0 0 6px;border:2px solid var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:3px solid rgba(13,19,48,.6);border-radius:16px;padding:10px}
.item .ic{font-size:34px;width:46px;text-align:center}
.item .tx{flex:1}
.item .tx b{font-weight:400;font-size:19px;display:block}
.item .tx small{font-family:system-ui,sans-serif;font-weight:700;font-size:12px;opacity:.9}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:16px;height:8px;border-radius:3px;background:rgba(13,19,48,.5)}
.pips i.on{background:var(--yellow)}
.item .btn{width:auto;min-width:96px}

/* ---------- Panels ---------- */
.panel{width:100%;max-width:360px;background:linear-gradient(#2f7bff,#1b4fd8);border:4px solid var(--ink);border-radius:26px;padding:20px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 0 rgba(13,19,48,.6)}
.panel h2{margin:0 0 4px;text-align:center;font-size:38px;font-weight:400}
.toggleRow{display:flex;align-items:center;justify-content:space-between;background:rgba(13,19,48,.35);border-radius:14px;padding:10px 14px;font-size:20px}
.toggleRow small{display:block;font-family:system-ui,sans-serif;font-weight:700;font-size:11px;opacity:.85;letter-spacing:0}
.sw{width:62px;height:34px;border-radius:999px;background:rgba(13,19,48,.7);border:3px solid #fff;position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--green)}
.sw.on::after{left:31px}
.big{font-size:56px;text-align:center;line-height:1}
.stat{display:flex;justify-content:space-between;font-size:22px;background:rgba(13,19,48,.35);border-radius:12px;padding:8px 14px}
.newBest{text-align:center;color:var(--yellow);font-size:24px;display:none;animation:pulse .5s infinite alternate}
#savePanel{align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring button{position:absolute;inset:16px;border-radius:50%;background:var(--yellow);color:var(--ink);font-size:24px;border:4px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;z-index:20;pointer-events:none}
#countdown.show{display:flex}
#rotate{position:fixed;inset:0;background:#1b4fd8;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;font-size:26px;padding:30px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <button id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
  <div id="invBadge">INVINCIBLE</div>
  <div id="scoreBox" class="stroke">
    <div id="score">0</div>
    <div class="row"><span id="coins">0</span><span class="coinIcon"></span></div>
    <div id="multBadge">x1</div>
  </div>
  <div id="powerups"></div>
  <div id="toast" class="stroke"></div>
</div>

<div id="menu" class="screen">
  <div style="display:flex;flex-direction:column;align-items:center">
    <img class="logo" src="icons/icon-512.png" alt="SurfHaven">
    <div class="chips stroke">
      <div class="chip">BEST <span id="bestTxt">0</span></div>
      <div class="chip"><span class="coinIcon" style="width:18px;height:18px"></span><span id="bankTxt">0</span></div>
      <div class="chip"><span class="keyIcon">🔑</span><span id="keysTxt">0</span></div>
    </div>
  </div>
  <div class="menuBottom">
    <div id="charLabel" class="stroke">HAVEN</div>
    <button id="playBtn" class="btn yellow">TAP TO PLAY</button>
    <div class="btnRow">
      <button id="shopBtn" class="btn blue">🛒 SHOP</button>
    </div>
    <div class="hint stroke">Swipe ← → to switch lanes · ↑ jump · ↓ roll</div>
  </div>
</div>

<div id="shop" class="screen">
  <div class="sheet">
    <div class="shopHead">
      <h2 class="stroke">SHOP</h2>
      <span class="freeTag">EVERYTHING FREE!</span>
      <button id="shopClose" class="btn red small" style="width:auto;padding:8px 14px;box-shadow:0 4px 0 #a3141c">✕</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="chars">Characters</button>
      <button class="tab" data-tab="power">Power-ups</button>
      <button class="tab" data-tab="items">Items</button>
    </div>
    <div class="shopBody" id="shopBody"></div>
  </div>
</div>

<div id="pause" class="screen dim">
  <div class="panel">
    <h2 class="stroke">PAUSED</h2>
    <div class="toggleRow"><div>Invincible<small>Can't crash or get caught</small></div><button class="sw" id="invSw" aria-label="Invincible"></button></div>
    <div class="toggleRow"><div>Sound</div><button class="sw" id="sndSw" aria-label="Sound"></button></div>
    <button id="resumeBtn" class="btn">▶ RESUME</button>
    <button id="quitBtn" class="btn red">QUIT RUN</button>
  </div>
</div>

<div id="saveme" class="screen dim">
  <div class="panel" id="savePanel">
    <h2 class="stroke">SAVE ME?</h2>
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(13,19,48,.5)" stroke-width="8"/>
        <circle id="ringArc" cx="50" cy="50" r="46" fill="none" stroke="#ffc21a" stroke-width="8" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
      <button id="saveBtn"><span>🔑 x<span id="saveCost">1</span></span><small style="font-size:14px">TAP!</small></button>
    </div>
    <div class="stroke" style="font-size:17px">You have 🔑 <span id="saveKeys">0</span></div>
    <button id="skipBtn" class="btn blue small" style="box-shadow:0 4px 0 #1640a8">SKIP</button>
  </div>
</div>

<div id="over" class="screen dim">
  <div class="panel">
    <h2 class="stroke">GAME OVER</h2>
    <div class="big stroke" id="finalScore">0</div>
    <div class="newBest stroke" id="newBest">★ NEW BEST! ★</div>
    <div class="stat stroke"><span>Coins</span><span id="finalCoins">0</span></div>
    <div class="stat stroke"><span>Best</span><span id="finalBest">0</span></div>
    <button id="againBtn" class="btn yellow">PLAY AGAIN</button>
    <button id="menuBtn" class="btn blue">MENU</button>
  </div>
</div>

<div id="countdown" class="stroke"></div>
<div id="rotate" class="stroke">Turn your phone upright to play SurfHaven 📱</div>

<script type="module" src="game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
